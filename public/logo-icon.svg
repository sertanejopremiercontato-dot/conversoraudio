<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Deep navy squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C24"/>
      <stop offset="50%" stop-color="#03081A"/>
      <stop offset="100%" stop-color="#010410"/>
    </linearGradient>

    <!-- Top Arrow Gradient (Cyan to Electric Blue) -->
    <linearGradient id="topArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0062FF"/>
      <stop offset="40%" stop-color="#0099FF"/>
      <stop offset="80%" stop-color="#00D5FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Bottom Arrow Gradient (Electric Blue to Cyan) -->
    <linearGradient id="bottomArrowGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0062FF"/>
      <stop offset="40%" stop-color="#0099FF"/>
      <stop offset="80%" stop-color="#00D5FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Audio Waveform Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <!-- Play Button Circle Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077FF"/>
      <stop offset="100%" stop-color="#004CE8"/>
    </linearGradient>

    <!-- Document Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#1E293B" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Rotating Circular Arrows (Clockwise Loop) -->
  <!-- Top & Left Arc Arrow Path -->
  <path d="M 124 336 C 88 280 90 198 134 142 C 176 86 254 64 322 80 C 348 86 372 98 392 114" 
        fill="none" 
        stroke="url(#topArrowGrad)" 
        stroke-width="28" 
        stroke-linecap="round"/>
  <!-- Top Arrow Head -->
  <polygon points="384,78 436,124 364,142" fill="#00D5FF"/>

  <!-- Bottom & Right Arc Arrow Path -->
  <path d="M 388 176 C 424 232 422 314 378 370 C 336 426 258 448 190 432 C 164 426 140 414 120 398" 
        fill="none" 
        stroke="url(#bottomArrowGrad)" 
        stroke-width="28" 
        stroke-linecap="round"/>
  <!-- Bottom Arrow Head -->
  <polygon points="128,434 76,388 148,370" fill="#0066FF"/>

  <!-- Center White Audio Document -->
  <!-- Main File Body with Top-Right Cut for Fold -->
  <path d="M 194 136 
           L 292 136 
           L 354 198 
           L 354 354 
           C 354 367 343 378 330 378 
           L 194 378 
           C 181 378 170 367 170 354 
           L 170 160 
           C 170 147 181 136 194 136 Z" 
        fill="#FFFFFF"/>

  <!-- Top-Right Fold Flap -->
  <path d="M 292 136 
           L 354 198 
           L 306 198 
           C 298 198 292 192 292 184 Z" 
        fill="url(#foldGrad)"/>

  <!-- Audio Waveform Bars (5 capsules inside document) -->
  <!-- Bar 1 (Leftmost) -->
  <rect x="190" y="244" width="12" height="34" rx="6" fill="url(#waveGrad)"/>
  <!-- Bar 2 -->
  <rect x="212" y="222" width="12" height="78" rx="6" fill="url(#waveGrad)"/>
  <!-- Bar 3 (Center tallest) -->
  <rect x="234" y="200" width="12" height="122" rx="6" fill="url(#waveGrad)"/>
  <!-- Bar 4 -->
  <rect x="256" y="222" width="12" height="78" rx="6" fill="url(#waveGrad)"/>
  <!-- Bar 5 (Rightmost) -->
  <rect x="278" y="244" width="12" height="34" rx="6" fill="url(#waveGrad)"/>

  <!-- Overlapping Play Button Circle (Bottom Right) -->
  <circle cx="348" cy="342" r="62" fill="url(#playGrad)"/>
  <circle cx="348" cy="342" r="62" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Play Triangle (Crisp White) -->
  <polygon points="334,314 378,342 334,370" fill="#FFFFFF"/>
</svg>